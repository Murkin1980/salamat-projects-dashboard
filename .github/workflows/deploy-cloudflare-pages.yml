name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 0,6,12,18 * * *"
      timezone: "Asia/Almaty"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: salamat-projects-dashboard-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    name: Verify and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Read-only GitHub credentials. An optional GH_TOKEN repository secret with
      # private-repository access takes precedence; otherwise the workflow's own
      # GITHUB_TOKEN installation token is used. Values are never printed.
      - name: Verify GitHub credentials are configured
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ -z "$GH_TOKEN" && -z "$GITHUB_TOKEN" ]]; then
            echo "::error::Neither GH_TOKEN nor GITHUB_TOKEN is available for the read-only GitHub portfolio sync."
            exit 1
          fi
          echo "GitHub credentials are available for the read-only portfolio sync."

      # A production deployment is allowed only after a successful fresh GitHub
      # portfolio sync. Never silently deploy the previous snapshot after a
      # failed synchronization.
      - name: Sync GitHub portfolio state
        id: github-sync
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run sync:github -- --output config/projects.github.json

      - name: Sync canonical MPE experiment registry
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run sync:experiments

      # Never let a damaged or empty snapshot reach the build: both published
      # artifacts must stay schema valid, byte-identical and credential free.
      - name: Verify published portfolio snapshot
        run: npm run verify:snapshot

      - name: Verify Cloudflare credentials are configured
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID repository secret."
            exit 1
          fi

      - name: Refresh Murat House discovery analytics
        run: npm run sync:discovery

      - name: Build
        run: npm run build

      - name: Deploy existing Cloudflare Pages project
        run: npx wrangler pages deploy dist --project-name salamat-projects-dashboard --branch main

      - name: Verify production snapshot
        shell: bash
        run: |
          expected="$(sha256sum public/project-state.json | awk '{print $1}')"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location \
              "https://projects.salamat-mebel.kz/project-state.json?deploy=${GITHUB_SHA}" \
              --output /tmp/project-state.json; then
              actual="$(sha256sum /tmp/project-state.json | awk '{print $1}')"
              if [[ "$actual" == "$expected" ]]; then
                echo "Production snapshot matches commit ${GITHUB_SHA}."
                exit 0
              fi
            fi
            echo "Production has not converged yet (attempt ${attempt}/12)."
            sleep 10
          done

          echo "::error::Production project-state.json does not match the committed snapshot after deployment."
          exit 1

      - name: Verify production discovery snapshot
        shell: bash
        run: |
          expected="$(sha256sum public/discovery-analytics.json | awk '{print $1}')"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location \
              "https://projects.salamat-mebel.kz/discovery-analytics.json?deploy=${GITHUB_SHA}" \
              --output /tmp/discovery-analytics.json; then
              actual="$(sha256sum /tmp/discovery-analytics.json | awk '{print $1}')"
              if [[ "$actual" == "$expected" ]]; then
                echo "Production discovery snapshot matches this deployment."
                exit 0
              fi
            fi
            echo "Production discovery snapshot has not converged yet (attempt ${attempt}/12)."
            sleep 10
          done

          echo "::error::Production discovery-analytics.json does not match this deployment."
          exit 1
